[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extore-processors"
version = "0.3.0"
description = "Reviewed, code-defined product processors for Extore"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "TokenNotIncluded"}]
dependencies = []

[project.urls]
Repository = "https://github.com/TokenNotIncluded/extore-processors"

[tool.setuptools.packages.find]
include = ["extore_processors*"]

[tool.ruff]
target-version = "py311"
