name: Processor tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.20"
      - run: uv run --no-project --python ${{ matrix.python }} python -m unittest discover -s tests -v
      - run: uv run --no-project --python ${{ matrix.python }} python -m compileall -q extore_processors tools
      - run: uv run --no-project --python ${{ matrix.python }} python tools/new_processor.py --help
